<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fern sign-in</title></head>
<body><p>Completing sign-in&hellip; you can close this window.</p>
<script>
(function () {
  // Forwards the IdP callback URL (single-use code) to the opener window.
  // Nothing is stored or logged here; the opener validates the response and
  // completes the sign-in, then this popup closes itself.
  try {
    if (window.opener) window.opener.postMessage({ type: 'fern-oidc-callback', url: location.href }, location.origin)
  } catch (error) { /* The opener is gone; there is nothing to complete. */ }
})();
</script>
</body>
</html>
