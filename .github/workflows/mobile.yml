name: Mobile packaging
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform, build-tools and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"
      - run: npm ci
      - run: npm run sdk:verify
      - run: npm test
      - run: npm run build
      - name: Install pinned Tauri CLI
        run: cargo install --locked tauri-cli --version 2.12.0
      - name: Init Android project
        run: cargo tauri android init
        working-directory: src-tauri
      - name: Build debug APK
        run: cargo tauri android build --debug
        working-directory: src-tauri
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fern-matrix-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  android-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform, build-tools and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"
      - run: npm ci
      - run: npm run sdk:verify
      - run: npm run build
      - name: Install pinned Tauri CLI
        run: cargo install --locked tauri-cli --version 2.12.0
      - name: Init Android project
        run: cargo tauri android init
        working-directory: src-tauri
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > /tmp/fern-upload.keystore
      - name: Build unsigned release APK and AAB
        run: cargo tauri android build --apk --aab
        working-directory: src-tauri
      - name: Sign release APK and AAB with the upload key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="${ANDROID_HOME}/build-tools/34.0.0"
          UNSIGNED_APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          SIGNED_APK=src-tauri/gen/android/app/build/outputs/apk/release/app-universal-release.apk
          mkdir -p "$(dirname "${SIGNED_APK}")"
          "${BT}/zipalign" -f 4 "${UNSIGNED_APK}" /tmp/fern-aligned.apk
          "${BT}/apksigner" sign --ks /tmp/fern-upload.keystore \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" --out "${SIGNED_APK}" /tmp/fern-aligned.apk
          "${BT}/apksigner" verify --print-certs "${SIGNED_APK}"
          UNSIGNED_AAB=src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          SIGNED_AAB=src-tauri/gen/android/app/build/outputs/bundle/release/app-universal-release.aab
          mkdir -p "$(dirname "${SIGNED_AAB}")"
          jarsigner -keystore /tmp/fern-upload.keystore -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -keypass "${ANDROID_KEY_PASSWORD}" -signedjar "${SIGNED_AAB}" "${UNSIGNED_AAB}" "${ANDROID_KEY_ALIAS}"
          jarsigner -verify "${SIGNED_AAB}"
          shred -u /tmp/fern-upload.keystore /tmp/fern-aligned.apk
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fern-matrix-android-release
          path: |
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do gh release view "${TAG}" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "${TAG}" \
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk \
            src-tauri/gen/android/app/build/outputs/bundle/release/*.aab \
            --clobber
