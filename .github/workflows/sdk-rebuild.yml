name: Reproducible Rust SDK rebuild
on:
  workflow_dispatch:
    inputs:
      sdk_probe_ref:
        description: 'Probe SDK ref (branch) to build instead of the pinned commit; empty keeps pins'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: sdk-rebuild
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
      - name: Free unused hosted-runner toolchains
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo apt-get clean
          df -h /
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild twice from pinned Rust sources
        env:
          SDK_CANDIDATE_DIR: ${{ runner.temp }}/fern-sdk-candidates
          FERN_SDK_PROBE_REF: ${{ inputs.sdk_probe_ref }}
        run: bash scripts/rebuild-sdk.sh
      - name: Upload reviewed rebuild candidates
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fern-rust-sdk-rebuild-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/fern-sdk-candidates/build-1/build-info.json
            ${{ runner.temp }}/fern-sdk-candidates/build-1/src/sdk/generated/wasm-bindgen/**
            ${{ runner.temp }}/fern-sdk-candidates/build-2/src/sdk/**
            ${{ runner.temp }}/fern-sdk-candidates/build-2/LICENSE.txt
            ${{ runner.temp }}/fern-sdk-candidates/build-2/Cargo.lock
            ${{ runner.temp }}/fern-sdk-candidates/build-2/web-Cargo.toml
            ${{ runner.temp }}/fern-sdk-candidates/build-2/build-info.json
            ${{ runner.temp }}/fern-sdk-candidates/sdk-build.Cargo.lock
      - name: Compile the app against the regenerated SDK
        run: |
          rm -rf src/sdk/generated
          cp -a "$RUNNER_TEMP/fern-sdk-candidates/build-2/src/sdk/generated" src/sdk/generated
          cp "$RUNNER_TEMP/fern-sdk-candidates/build-2/src/sdk/index.ts" src/sdk/index.ts
          npm ci
          npx playwright install --with-deps chromium
          python -m venv .cache/fern-synapse
          .cache/fern-synapse/bin/pip install -r tests/integration/requirements.txt
          npm run build
          npm run test:integration
