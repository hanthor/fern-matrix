server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types application/wasm application/javascript text/css application/json;
  gzip_min_length 1024;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https: wss:; frame-src https://call.element.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location = /sw.js { add_header Cache-Control 'no-cache'; }
  location /assets/ { expires 1y; }
  location / { try_files $uri $uri/ /index.html; }
}
